# A股多因子选股系统 — 回测配置
# 修改参数后直接运行: python local_backtest.py

data:
  source: sina                  # 数据源: sina | akshare | westock
  cache_ttl_hours: 1            # 缓存有效期（小时）

data_source:
  cache_dir: data_cache

env_regime:
  bull_threshold: 0.6            # 多少指数站上MA60算多头
  bear_threshold: 0.3            # 多少指数站上MA60算空头
  bull_cap_pct: 100              # 多头仓位 (%)
  bear_cap_pct: 20               # 空头仓位 (%)
  neutral_cap_pct: 50            # 震荡仓位 (%)

filter_l2:
  min_market_cap: 20e8           # 最小市值 (20亿)
  max_pe: 300                    # 最大PE
  min_close: 1                   # 最低股价
  exclude_st: true               # 排除ST
  min_turnover: 0.3              # 最低换手 (%)

factor_l4:
  max_per_sector: 5              # 每板块最多
  max_picks: 50                  # 最多候选数
  factors:
    value: 0.15                  # 价值因子权重 (PE/PB)
    quality: 0.20                # 质量因子权重 (ROE/毛利率)
    growth: 0.15                 # 成长因子权重 (营收增速)
    momentum: 0.30               # 动量因子权重 (20日/60日涨跌)
    volatility: 0.10             # 低波因子权重
    size: 0.10                   # 规模因子权重
  initial_capital: 50000        # 初始资金（元）
  max_picks_per_day: 20         # 每日最多持仓
  min_cash_to_trade: 5000       # 现金低于此数不买入

risk:
  stop_loss: 5.0                # 止损线 (%)
  target_base: 3.0              # 基础目标收益 (%)
  target_max: 8.0               # 最高目标收益 (%)
  max_single_position: 0.5      # 单只最大仓位 (50%)

timing:
  market_ma: 60                 # 择时均线天数
  enabled: true                 # 是否启用择时

trade:
  stock_cost: 0.0013            # 股票交易成本 (万0.854+印花税)
  etf_cost: 0.00017             # ETF交易成本 (免印花税)

holding:
  min_days: 3                   # 最短持仓
  max_days: 10                  # 最长持仓
  momentum_decay_days: 3        # 跌破买入价N天后认定为动量衰减

universe:
  min_list_days: 252            # 最少上市天数（排除新股）
  exclude_st: true              # 排除ST/退市

output:
  save_csv: true                # 保存资产曲线CSV
  save_html: true               # 生成可视化HTML报告
