# A股多因子选股系统 — 回测配置
# 修改参数后直接运行: python local_backtest.py

portfolio:
  initial_capital: 20000        # 初始资金（元）— 与 account.available_cash 对齐
  max_picks_per_day: 20         # 每日最多持仓
  min_cash_to_trade: 5000       # 现金低于此数不买入

risk:
  stop_loss: 5.0                # 止损线 (%)
  target_base: 3.0              # 基础目标收益 (%)
  target_max: 8.0               # 最高目标收益 (%)
  max_single_position: 0.5      # 单只最大仓位 (50%)

timing:
  market_ma: 60                 # 择时均线天数
  enabled: true                 # 是否启用择时

trade:
  stock_cost: 0.0013            # 股票交易成本 (万0.854+印花税)
  etf_cost: 0.00017             # ETF交易成本 (免印花税)

holding:
  min_days: 3                   # 最短持仓
  max_days: 10                  # 最长持仓
  momentum_decay_days: 3        # 跌破买入价N天后认定为动量衰减

universe:
  min_list_days: 252            # 最少上市天数（排除新股）
  exclude_st: true              # 排除ST/退市

output:
  save_csv: true                # 保存资产曲线CSV
  save_html: true               # 生成可视化HTML报告

# ============================================================
# 盘前简报 — 篮子仓位分配 (basket allocation)
# ------------------------------------------------------------
# 环境仓位上限 position_cap 是「总资金」天花板, 不能直接当作单只票的仓位。
# 这里把它切分为三个篮子, 各篮子预算 = position_cap × 权重;
# 篮子内再按评分加权分配到每只票 (allocate_basket)。
# 这样: 单只票只是总资金的一小块; 同篮子各票仓位%相加 = 该篮子预算;
#       所有篮子预算相加 (= 权重和) × position_cap ≤ 总资金上限。
# 例(震荡 cap=50%): 中长线 25% + 短线 15% + ETF 10% = 50%。
# ============================================================
brief:
  sleeve_weights:
    quality: 0.50        # 中长线质量仓（牛市主力）
    short_term: 0.30     # 短线反弹仓
    etf: 0.20            # ETF 定投仓（不计入战术仓位表, 单独 DCA）
  max_single_position: 0.08   # 单只股票占总资金上限 (8%)
  method: score_weighted      # score_weighted | equal

# ============================================================
# 回测引擎 — 因子权重 (可被覆盖, 便于调参)
# ------------------------------------------------------------
# 关键修复: 旧版 key 用 momentum/pe_value (无 f_ 前缀), 但 score_stocks 内
# weights.get(col) 用 f_momentum/f_pe_value 等 → 永远命中不到 → 全部回退 1/len 均权,
# 调参彻底失效 (已修正为本文件的 f_ 前缀)。
# 设计(B1): 相对强度(f_rs 0.18)+趋势(f_trend 0.10) 主导, 估值(pe+pb=0.17)显著下调,
# 质量降至0.05(规避 static 前视接盘未来大白马)。真正确解见 M6(时点对齐基本面)。
# ============================================================
backtest:
  factor_weights:
    f_momentum: 0.06
    f_momentum_25d: 0.05
    f_momentum_multi: 0.03
    f_rs: 0.18
    f_trend: 0.10
    f_pe_value: 0.10
    f_pb_value: 0.07
    f_small_cap: 0.06
    f_low_vol: 0.10
    f_quality: 0.05
