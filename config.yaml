# A股多因子选股系统 — 回测配置
# 修改参数后直接运行: python local_backtest.py

data:
  source: sina                  # 数据源: sina | akshare | westock
  cache_ttl_hours: 1            # 缓存有效期（小时）

data_source:
  cache_dir: data_cache

env_regime:
  indices:                       # 参考指数
    - code: "000001"
      name: "上证指数"
    - code: "399001"
      name: "深证成指"
    - code: "399006"
      name: "创业板指"
  ma_short: 20                   # 短期均线
  ma_long: 60                    # 长期均线
  regime_thresholds:
    bull_above_ma_ratio: 0.6     # 站上MA的指数比例 ≥ 此值 → 多头
    bear_below_ma_ratio: 0.3     # 站上MA的指数比例 ≤ 此值 → 空头
  position_caps:
    bull: 1.0                    # 多头仓位
    bear: 0.2                    # 空头仓位
    neutral: 0.5                 # 震荡仓位

filter_l2:
  min_market_cap: 2000000000     # 最小市值 (20亿)
  max_pe: 300                    # 最大PE
  min_close: 1                   # 最低股价
  exclude_st: true               # 排除ST
  min_turnover: 0.3              # 最低换手 (%)

factor_l4:
  max_per_sector: 5              # 每板块最多
  max_picks: 50                  # 最多候选数
  factors:
    - name: value
      weight: 0.15
    - name: quality
      weight: 0.20
    - name: growth
      weight: 0.15
    - name: momentum
      weight: 0.30
    - name: volatility
      weight: 0.10
    - name: size
      weight: 0.10
  initial_capital: 50000        # 初始资金（元）
  max_picks_per_day: 20         # 每日最多持仓
  min_cash_to_trade: 5000       # 现金低于此数不买入

risk:
  stop_loss: 5.0                # 止损线 (%)
  target_base: 3.0              # 基础目标收益 (%)
  target_max: 8.0               # 最高目标收益 (%)
  max_single_position: 0.5      # 单只最大仓位 (50%)

timing:
  market_ma: 60                 # 择时均线天数
  enabled: true                 # 是否启用择时

trade:
  stock_cost: 0.0013            # 股票交易成本 (万0.854+印花税)
  etf_cost: 0.00017             # ETF交易成本 (免印花税)

holding:
  min_days: 3                   # 最短持仓
  max_days: 10                  # 最长持仓
  momentum_decay_days: 3        # 跌破买入价N天后认定为动量衰减

universe:
  min_list_days: 252            # 最少上市天数（排除新股）
  exclude_st: true              # 排除ST/退市

output:
  save_csv: true
  save_html: true
  brief_dir: briefs
  brief_filename: 盘前选股简报.md
  date_based_archive: true
